plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'onix-client'
}
version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The version-independent client: modules, settings, menu.
	implementation 'onix:core'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The core has no Minecraft references, so its classes go straight into the mod jar.
jar {
	// Unpack the core jar that the main build produces into this one.
	from {
		configurations.runtimeClasspath.findAll { it.name.startsWith('core-') }.collect { zipTree(it) }
	}
	exclude 'META-INF/MANIFEST.MF'
}

// Development runs: ONIX_SELFTEST makes the game start the client, report and quit.
tasks.withType(JavaExec).configureEach {
	if (System.getenv('ONIX_SELFTEST')) jvmArgs '-Donix.dev.selftest=true'
}
